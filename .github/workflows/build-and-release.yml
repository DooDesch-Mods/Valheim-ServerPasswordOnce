name: Build and Release on Tag

# Push a tag "vX.Y.Z" on the default branch and this builds Release, publishes a GitHub Release, and
# uploads to Thunderstore + Nexus. Mirrors the Schedule I and Mimesis pipelines.
#
# One-time setup:
#   - Private build-libs repo  ${owner}/Valheim-Workspace  must contain lib/game, lib/bepinex,
#     lib/serversync (see Workspace/lib/README.md).
#   - Secrets: WORKSPACE_TOKEN (SSH deploy key for that repo, per repo); THUNDERSTORE_TOKEN,
#     NEXUSMODS_API_KEY and DISCORD_RELEASE_WEBHOOK are org secrets and are inherited.
#   - Repo variables NEXUS_FILE_GROUP_ID and NEXUS_MOD_ID (the Nexus upload job is skipped until both
#     are set, so GitHub + Thunderstore releases work immediately). NEXUS_MOD_ID is the global uid:
#     3667 * 2^32 + <page id> (3667 = Valheim on Nexus).
#   - thunderstore/icon.png must be exactly 256x256 (Thunderstore requirement).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  MOD_NAME: ServerPasswordOnce

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version-check.outputs.version }}
      notes: ${{ steps.changelog.outputs.notes }}
      notes_bbcode: ${{ steps.changelog.outputs.notes_bbcode }}
      notes_plain: ${{ steps.changelog.outputs.notes_plain }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Workspace repository (build libs)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Valheim-Workspace
          ref: 9efa9532615c1c5e106f98637f1eb64361e80e78 # Update deliberately after validating Workspace changes.
          path: Workspace
          ssh-key: ${{ secrets.WORKSPACE_TOKEN }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The tag is the ONLY place a release version is decided; the csproj keeps a 0.0.0-dev fallback it
      # never bumps. See Workspace/docs/RELEASE-PROCESS.md. Both checks below run before anything is
      # built, so a bad tag costs seconds rather than a published artefact.
      - name: Preflight - tag shape and branch
        id: version-check
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"

          # The `v*` trigger is a glob, not a pattern check - it also matches v1.2, vNext and v1.2.3-rc1.
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must be exactly vX.Y.Z, got '$TAG'."
            exit 1
          fi

          # A tag on a feature branch would publish a version nobody can reproduce from the default branch.
          git fetch --no-tags origin "$DEFAULT_BRANCH":"refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag $TAG is not on $DEFAULT_BRANCH. Merge first, then tag the commit on $DEFAULT_BRANCH."
            exit 1
          fi

          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      # The version lives in the tag and nowhere else. A real number in the csproj, the manifest or the
      # attribute would drift from the tag the moment the next one is pushed.
      - name: Preflight - version placeholders
        run: |
          set -euo pipefail
          grep -q '<Version Condition="'"'"'\$(Version)'"'"' == '"'"''"'"'">0.0.0-dev</Version>' "$MOD_NAME.csproj" \
            || { echo "::error::$MOD_NAME.csproj must keep the 0.0.0-dev fallback; the version comes from the tag."; exit 1; }
          grep -q '"version_number": "0.0.0"' thunderstore/manifest.json \
            || { echo "::error::thunderstore/manifest.json must keep version_number 0.0.0; the workflow stamps the tag."; exit 1; }
          grep -q 'DooDesch.ModVersion.Current' Core.cs \
            || { echo "::error::Core.cs must pass DooDesch.ModVersion.Current to BepInPlugin, not a literal."; exit 1; }

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          # Single source of truth is the hand-maintained CHANGELOG.md. Pull out the section for
          # this version; it is reused for the GitHub release body and the Nexus file description.
          VERSION="${{ steps.version-check.outputs.version }}"
          SECTION=$(awk -v v="$VERSION" 'index($0,"## ["v"]")==1{grab=1;next} index($0,"## [")==1{if(grab)exit} grab{print}' CHANGELOG.md)
          # Fatal, not a warning: an empty section would publish nothing to three stores at once.
          if [ -z "$(printf '%s' "$SECTION" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no non-empty '## [$VERSION]' section. Write the section, then re-tag."
            exit 1
          fi
          HEADINGS=$(grep -c "^## \[$VERSION\]" CHANGELOG.md || true)
          if [ "$HEADINGS" != "1" ]; then
            echo "::error::CHANGELOG.md has $HEADINGS '## [$VERSION]' headings, expected exactly 1."
            exit 1
          fi
          # Markdown notes - GitHub renders Markdown in release bodies.
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$SECTION"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
          # Nexus file descriptions are BBCode, not Markdown, and anything left unconverted shows up on the
          # page as literal asterisks or bracket-and-paren pairs. This turns the CHANGELOG section into the
          # subset Nexus renders: **bold**, [text](url), ATX headings, "- " bullets with one level of
          # nesting, and hard-wrapped paragraphs joined back into one line. Inline-code backticks are
          # dropped. POSIX awk only - the runner's awk is mawk: no interval expressions, no gensub, no
          # capture groups.
          BBCODE=$(printf '%s\n' "$SECTION" | awk '
            function inline(s,   t, m, p, txt, url) {
              while (match(s, /\*\*[^*]+\*\*/)) {
                t = substr(s, RSTART + 2, RLENGTH - 4)
                s = substr(s, 1, RSTART - 1) "[b]" t "[/b]" substr(s, RSTART + RLENGTH)
              }
              while (match(s, /\[[^]]+\]\([^)]+\)/)) {
                m = substr(s, RSTART, RLENGTH)
                p = index(m, "](")
                txt = substr(m, 2, p - 2)
                url = substr(m, p + 2, length(m) - p - 2)
                s = substr(s, 1, RSTART - 1) "[url=" url "]" txt "[/url]" substr(s, RSTART + RLENGTH)
              }
              return s
            }
            function flushitem() { if (item != "") { printf "[*]%s\n", inline(item); item = "" } }
            function flushpara() { if (para != "") { printf "%s\n", inline(para); para = "" } }
            function setlevel(want) {
              flushitem()
              while (lvl > want) { print "[/list]"; lvl-- }
              while (lvl < want) { print "[list]"; lvl++ }
            }
            BEGIN { lvl = 0; item = ""; para = "" }
            {
              raw = $0; gsub(/`/, "", raw); sub(/[ \t]+$/, "", raw)
              if (raw ~ /^[ \t]*$/) { flushitem(); flushpara(); next }
              if (raw ~ /^#+ /) { flushitem(); flushpara(); setlevel(0); h = raw; sub(/^#+ +/, "", h); printf "[b]%s[/b]\n", inline(h); next }
              if (raw ~ /^[ \t]*[-*] /) { flushpara(); indent = match(raw, /[^ \t]/) - 1; setlevel(indent >= 2 ? 2 : 1); item = raw; sub(/^[ \t]*[-*] +/, "", item); next }
              sub(/^[ \t]+/, "", raw)
              if (item != "") { item = item " " raw; next }
              setlevel(0)
              para = (para == "" ? raw : para " " raw)
            }
            END { flushitem(); flushpara(); setlevel(0) }')
          {
            echo "notes_bbcode<<CHANGELOG_EOF"
            echo "$BBCODE"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
          # A THIRD rendering: the Nexus Changelogs section takes plain text, one entry per line, no markup.
          PLAIN=$(printf '%s\n' "$SECTION" | awk '
            function inline(s,   t, m, p, txt, url) {
              while (match(s, /\*\*[^*]+\*\*/)) {
                t = substr(s, RSTART + 2, RLENGTH - 4)
                s = substr(s, 1, RSTART - 1) t substr(s, RSTART + RLENGTH)
              }
              while (match(s, /\[[^]]+\]\([^)]+\)/)) {
                m = substr(s, RSTART, RLENGTH)
                p = index(m, "](")
                txt = substr(m, 2, p - 2)
                url = substr(m, p + 2, length(m) - p - 2)
                s = substr(s, 1, RSTART - 1) txt " (" url ")" substr(s, RSTART + RLENGTH)
              }
              return s
            }
            function flush() { if (item != "") { printf "%s%s\n", pad, inline(item); item = ""; pad = "" } }
            BEGIN { item = ""; pad = "" }
            {
              raw = $0; gsub(/`/, "", raw); sub(/[ \t]+$/, "", raw)
              if (raw ~ /^[ \t]*$/) { flush(); next }
              if (raw ~ /^#+ /) { flush(); h = raw; sub(/^#+ +/, "", h); printf "%s\n", inline(h); next }
              if (raw ~ /^[ \t]*[-*] /) {
                flush()
                indent = match(raw, /[^ \t]/) - 1
                pad = (indent >= 2 ? "  " : "")
                item = raw; sub(/^[ \t]*[-*] +/, "", item)
                next
              }
              sub(/^[ \t]+/, "", raw)
              if (item != "") { item = item " " raw; next }
              printf "%s\n", inline(raw)
            }
            END { flush() }')
          {
            echo "notes_plain<<CHANGELOG_EOF"
            echo "$PLAIN"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build the project (Release)
        run: >
          dotnet build $MOD_NAME.csproj --configuration Release
          -p:Version="${{ steps.version-check.outputs.version }}"
          -p:WorkspaceLibPath="${{ github.workspace }}/Workspace/lib"
          -p:GameManagedPath="${{ github.workspace }}/Workspace/lib/game"
          -p:BepInExPath="${{ github.workspace }}/Workspace/lib/bepinex"
          -p:ServerSyncPath="${{ github.workspace }}/Workspace/lib/serversync"
          -p:DeployVerifyDisable=true
          -p:RestoreLockedMode=true

      - name: Prepare release directory
        run: |
          mkdir -p release
          cp "bin/Release/net48/$MOD_NAME.dll" release/
          cp -r thunderstore/* release/
          sed -i "s/\"version_number\": \".*\"/\"version_number\": \"${{ steps.version-check.outputs.version }}\"/" release/manifest.json
          # Ship LICENSE + the maintained CHANGELOG inside the package.
          [ -f "LICENSE.md" ] && cp LICENSE.md release/ || true
          [ -f "CHANGELOG.md" ] && cp CHANGELOG.md release/ || true
          # README.md as UTF-8 without BOM (Thunderstore renders it on the mod page).
          sed '1s/^\xEF\xBB\xBF//' thunderstore/README.md > release/README.md

      # Thunderstore and mod managers put every file at the archive root into BepInEx/plugins/<Team-Mod>/,
      # so a flat zip is the correct shape for them and for the GitHub release.
      - name: Create release ZIP (Thunderstore + GitHub; flat layout with manifest/icon at root)
        run: zip -j "${MOD_NAME}_${{ steps.version-check.outputs.version }}.zip" release/*

      - name: Upload Release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_NAME }}
          path: "${{ env.MOD_NAME }}_${{ steps.version-check.outputs.version }}.zip"

      # A Nexus user extracts by hand into the game folder: the DLL goes under BepInEx/plugins/<Mod>/ and
      # the Thunderstore-only files (manifest, icon) stay out.
      - name: Create Nexus ZIP (BepInEx/plugins/<Mod>/ layout for manual install)
        run: |
          mkdir -p "nexus/BepInEx/plugins/$MOD_NAME"
          cp "release/$MOD_NAME.dll" "nexus/BepInEx/plugins/$MOD_NAME/"
          for f in README.md CHANGELOG.md LICENSE.md; do
            [ -f "release/$f" ] && cp "release/$f" nexus/ || true
          done
          (cd nexus && zip -r "../${MOD_NAME}_${{ steps.version-check.outputs.version }}_nexus.zip" .)

      - name: Upload Nexus ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_NAME }}-nexus
          path: "${{ env.MOD_NAME }}_${{ steps.version-check.outputs.version }}_nexus.zip"

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download built ZIP
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.MOD_NAME }}

      - name: Extract DLL from ZIP
        run: |
          unzip -q "${MOD_NAME}_${{ needs.build.outputs.version }}.zip" -d release/
          ls -la release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: release/${{ env.MOD_NAME }}.dll
          body: |
            ## Changes in ${{ needs.build.outputs.version }}

            ${{ needs.build.outputs.notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Discord renders a `release` webhook as an empty box, so the embed is built here, where the version
      # and the changelog section are already known. Runs only after the GitHub release succeeded; exits
      # early when the secret is not set.
      - name: Announce the release in Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          VERSION: ${{ needs.build.outputs.version }}
          NOTES: ${{ needs.build.outputs.notes }}
          REPO: ${{ github.repository }}
          NEXUS_MOD_ID: ${{ vars.NEXUS_MOD_ID }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "DISCORD_RELEASE_WEBHOOK is not set - nothing announced."; exit 0; fi

          SHORT="${REPO#*/}"
          NAME=$(jq -r '.name // empty' thunderstore/manifest.json)
          [ -z "$NAME" ] && NAME="${SHORT#Valheim-}"

          LINKS="[Thunderstore](https://thunderstore.io/c/valheim/p/DooDesch/$NAME/) · [GitHub](https://github.com/$REPO/releases/tag/v$VERSION)"

          # NEXUS_MOD_ID is the global uid, game_id * 2^32 + page_id, and the page id is what the URL wants.
          if [ -n "$NEXUS_MOD_ID" ]; then
            GAME_ID=$(( NEXUS_MOD_ID / 4294967296 ))
            PAGE_ID=$(( NEXUS_MOD_ID % 4294967296 ))
            if [ "$GAME_ID" = "3667" ]; then
              LINKS="[Nexus](https://www.nexusmods.com/valheim/mods/$PAGE_ID) · $LINKS"
            fi
          fi

          # jq builds the JSON so a changelog with quotes, backticks or newlines cannot break the payload.
          jq -n --arg title "$NAME $VERSION" \
                --arg url "https://github.com/$REPO/releases/tag/v$VERSION" \
                --arg desc "$NOTES" \
                --arg icon "https://raw.githubusercontent.com/$REPO/main/thunderstore/icon.png" \
                --arg links "$LINKS" \
                --arg foot "Valheim · $SHORT" \
            '{embeds: [{
                title: $title,
                url: $url,
                description: ($desc | if length > 1400 then .[0:1400] + "\n..." else . end),
                color: 8256434,
                thumbnail: {url: $icon},
                fields: [{name: "Get it", value: $links}],
                footer: {text: $foot}
             }]}' > payload.json

          curl -sS -f -X POST -H "Content-Type: application/json" -d @payload.json "$WEBHOOK" \
            && echo "announced $NAME $VERSION"

  thunderstore:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download built ZIP
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.MOD_NAME }}

      - name: Extract ZIP for Thunderstore
        run: |
          mkdir -p thunderstore-package
          unzip -q "${MOD_NAME}_${{ needs.build.outputs.version }}.zip" -d thunderstore-package/

      - name: Upload to Thunderstore
        uses: GreenTF/upload-thunderstore-package@v4.3
        with:
          token: ${{ secrets.THUNDERSTORE_TOKEN }}
          community: valheim
          repo: thunderstore.io
          namespace: DooDesch
          name: ${{ env.MOD_NAME }}
          description: "The server asks a returning player for the password only when it changed."
          version: ${{ needs.build.outputs.version }}
          path: thunderstore-package
          deps: |
            denikson-BepInExPack_Valheim-5.4.2333
          categories: |
            mods

  nexus:
    needs: build
    runs-on: ubuntu-latest
    # Skipped until the Nexus mod page exists and both IDs are set as repo variables.
    if: ${{ vars.NEXUS_FILE_GROUP_ID != '' && vars.NEXUS_MOD_ID != '' }}
    steps:
      - name: Download Nexus ZIP
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.MOD_NAME }}-nexus

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUS_FILE_GROUP_ID }}
          mod_id: ${{ vars.NEXUS_MOD_ID }}
          filename: "${{ env.MOD_NAME }}_${{ needs.build.outputs.version }}_nexus.zip"
          version: ${{ needs.build.outputs.version }}
          display_name: "${{ env.MOD_NAME }} ${{ needs.build.outputs.version }}"
          description: ${{ needs.build.outputs.notes_bbcode }}
          changelog: ${{ github.event_name == 'push' && github.run_attempt == 1 && needs.build.outputs.notes_plain || '' }}
          category: main
          archive_existing_version: true
          update_mod_version: true
          primary_mod_manager_download: true
          allow_mod_manager_download: true
